name: CI

on:
  # Only master runs on push. Feature branches are covered by their pull_request run,
  # so a branch with an open PR no longer runs the whole matrix twice (push + PR events;
  # the concurrency group below only dedupes within a single event).
  push:
    branches: [master]
  pull_request:
  # Weekly run (Mon 06:00 UTC). The reason MOVED on 2026-08-11 and is worth keeping
  # straight: `requirements.txt` is now pinned, so pydivert and psutil no longer
  # drift. Three things still do, and a scheduled build is the only thing watching
  # them between pushes:
  #   * `requirements-dev.txt` is deliberately unpinned - pytest, hypothesis and
  #     pytest-cov track latest, and a new pytest can redden a green suite;
  #   * the runner image and the 3.14.x patch `setup-python` resolves both move
  #     under us - and that is not theoretical: a 3.14 patch brought Tcl/Tk 9.0,
  #     whose DLL-embedded library archive broke the frozen exe on an older
  #     PyInstaller and added `libtommath` to the bundle (2026-08-17).
  # `pyinstaller` USED to be unpinned here and in release.yml, which is how the
  # same commit could build a working exe on CI and a crashing one on a developer
  # machine. It is pinned in requirements-build.txt now, so what this cron watches
  # on the build side is the runner and the interpreter, not the freezer.
  #
  # 🔴 A red cron is only worth the minutes if somebody reads it. The owner
  # decided against opening an issue automatically (2026-08-17), so this run is
  # checked by hand - `gh run list --workflow CI --branch master`.
  schedule:
    - cron: "0 6 * * 1"
  # Allow running the pipeline by hand from the Actions tab.
  workflow_dispatch:

# Least-privilege token: CI only reads the repository. If a step ever needs to write
# (releases, pages), raise the permission on THAT job, not here.
permissions:
  contents: read

# One in-flight run per ref: a push to a branch with an open PR no longer runs CI twice,
# and a newer push cancels the superseded run (saves minutes, above all the Windows build).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite scans FILES. A commit message and a pull-request description are just
  # as public and just as permanent - a message cannot be edited away, because the
  # commit that carried it stays - and nothing in tests/ can see either of them. So
  # the conventions that govern them (English only, plain hyphens, nothing private
  # to a machine) were held up by remembering, every time. This is the guard.
  public-text:
    name: commit messages and PR description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the whole range being merged, not just its tip
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: check the commit messages
        # Through the environment, for the same reason as the step below: a
        # `${{ }}` is pasted into the script BEFORE any shell sees it, so a
        # branch name is not data there - it is source code. `base_ref` has to
        # name a branch that already exists here, which makes this narrow rather
        # than harmless, and the fix is three lines. Quote the variables: an
        # unquoted expansion is the same fault one layer down.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/check_public_text.py --commits "origin/$BASE_REF..$HEAD_SHA"
      - name: check the pull-request description
        # Passed through the environment rather than interpolated into the shell:
        # a description is untrusted text and must never become part of a command.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.txt
          python tools/check_public_text.py --text-file pr-body.txt

  # Static analysis, one platform: ruff reads source, and source does not differ
  # between the runners. Kept out of the `tests` matrix for exactly that reason -
  # in there it would run twice and say the same thing.
  lint:
    name: ruff (F and B block, S and ASYNC report)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the linter
        run: pip install -r requirements-lint.txt
      # The gate. `--select` on the command line replaces the families named in
      # pyproject.toml and nothing else: the per-file ignores and the target
      # version still come from there, so the two runs below cannot drift apart
      # from what a developer sees locally.
      - name: Bugs and dead code (blocking)
        run: ruff check --select F,B --output-format github
      # The report. S is 306 findings on this repository and 287 of them are
      # things a test suite for a packet mangler does on purpose - so it
      # annotates the diff and never fails the run. `ruff check` exits 1 on any
      # finding, hence --exit-zero rather than a `continue-on-error` on the step:
      # a step that "succeeded but failed" reads as a broken job to everybody.
      - name: Security patterns and async misuse (report only)
        run: ruff check --select S,ASYNC --exit-zero --output-format github

  # Its own job rather than a step in `lint`: two gates, two check names, so a
  # branch-protection rule can require either one on its own and a red one says
  # which of the two it was without opening the log.
  types:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the type checker
        run: pip install -r requirements-lint.txt
      # No project dependencies installed on purpose: `pydivert` is Windows-only
      # and `psutil` is not needed to READ this package, and both are ignored by
      # name in [tool.mypy]. Verified in that exact shape (Linux, neither
      # installed) before this job was written - a missing module and an untyped
      # one are different code paths in mypy, and only one of them was measured
      # on the developer machine.
      - name: Type check the package
        run: mypy

  # Semgrep, with no account and no token: `p/default` is fetched anonymously
  # from the registry (measured - 343 rules, 184 files, 35 s). The rules are used
  # here and never carried in the repository, because the Semgrep Rules License
  # allows the first and forbids the second.
  semgrep:
    name: semgrep (ERROR, HIGH and CRITICAL block)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the scanner
        run: pip install -r requirements-lint.txt
      # No --error and no --severity here: the scan reports, and tools/semgrep_gate.py
      # decides. `--severity` knows INFO/WARNING/ERROR only, while registry rules also
      # carry HIGH and CRITICAL - measured with a probe rule, `--severity ERROR`
      # returned zero findings for a rule marked HIGH. Metrics are off: this repository
      # does not send telemetry about its own source anywhere.
      - name: Scan
        run: |
          semgrep scan --config p/default --metrics=off --oss-only \
            --json --output semgrep.json --quiet
      - name: Decide
        run: python tools/semgrep_gate.py semgrep.json

  # Weekly, on Windows, and only weekly: this asks whether the world changed
  # under versions that did not. A pull request cannot make it red, so running it
  # per pull request would burn minutes to re-answer the same question.
  #
  # windows-latest because that is where the shipped set actually exists:
  # `pydivert` carries a `sys_platform == "win32"` marker, so a Linux runner would
  # skip the one dependency that puts a kernel driver on a user's machine.
  audit:
    name: pip-audit (advisories against the pinned set)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Raised on THIS job only, and only because it opens an issue when it finds
      # something. Nothing else in this workflow may write anything.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the auditor
        run: pip install -r requirements-lint.txt
      # The pinned set, installed exactly as the build installs it, into its own
      # environment - then audited BY PATH. Auditing the requirement files instead
      # silently skips `packaging` and `setuptools` (measured), and a scanner that
      # covers less than it was asked to is worse than no scanner at all.
      - name: Install the pinned set into a clean environment
        shell: bash
        run: |
          python -m venv audit-env
          audit-env/Scripts/python -m pip install --quiet \
            --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Audit it
        shell: bash
        # pip-audit exits non-zero when it finds something, and finding something
        # is what the next step is for - so the exit code is captured, not obeyed.
        run: |
          set +e
          pip-audit --path audit-env/Lib/site-packages -f json -o audit.json
          echo "pip-audit exit: $?"
          set -e
          test -s audit.json || { echo "no report was written"; exit 1; }
      - name: Open an issue if anything was found
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label security-scan --state open --json number,title > open.json
          action=$(python tools/audit_issue.py --audit audit.json --existing open.json \
                     --title-out issue-title.txt --body-out issue-body.md \
                     --run-url "$RUN_URL")
          echo "verdict: $action"
          case "$action" in
            create)
              gh label create security-scan --color B60205 \
                  --description "opened by the weekly dependency audit" --force
              gh issue create --label security-scan \
                  --title "$(cat issue-title.txt)" --body-file issue-body.md
              ;;
            skip) echo "an open issue already names exactly these advisories" ;;
            none) echo "nothing published against the pinned set" ;;
            *)    echo "unexpected verdict from tools/audit_issue.py"; exit 1 ;;
          esac

  # The registry that ships is checked by the suite for POINTING at code that
  # exists. Nothing in the repository ever RAN one, so "116 caught, 0 survived"
  # was true on the day somebody typed it and unverifiable afterwards. This is
  # that sentence, executed.
  #
  # windows-latest, and not to be tidy: `pydivert` carries a win32 marker, and an
  # entry whose test needs the driver would report SURVIVED on a Linux runner -
  # the test passes there by returning early, which is indistinguishable from a
  # guard that does not guard.
  mutations:
    name: mutation registry
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `--changed` diffs against the base branch, which has to be here.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      # A pull request pays for what it touched; the weekly run pays for
      # everything. The full pass is minutes (~13 for 117 entries on a developer
      # machine), which is fine once a week and absurd on every push.
      - name: Break each guarded behaviour and prove its test reddens
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          # Through the environment like every other context value here - the
          # repository's own guard refuses a `${{ }}` inside a run block, and it
          # refused this one while it was being written.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=0 origin "$BASE_REF"
            python tools/mutate.py --changed "origin/$BASE_REF"
          else
            python tools/mutate.py
          fi

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The matrix varies the OS, not the interpreter. `requires-python` stays at
    # >=3.10 on purpose - installing from source on an older Python is supported -
    # but CI proves the version the project is actually developed, built and
    # released on. Testing 3.10 was exercising a configuration nobody ships.
    # If that trade stops being worth it, add a version back HERE; do not "fix"
    # the gap by raising requires-python to match.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify required release files are in the checkout
        # These are git-ignored by pattern and re-included by exception, so a
        # missing force-add or a broken .gitignore makes them vanish on a fresh
        # clone. Fail here, loudly, instead of deep inside a test or PyInstaller.
        shell: bash
        run: |
          missing=0
          for f in BeanNetworkTester.spec VERSION.txt LICENSE \
                   THIRD-PARTY-NOTICES.md pyproject.toml CHANGELOG.md; do
            if [ ! -f "$f" ]; then echo "MISSING from the repo: $f"; missing=1; fi
          done
          for d in beantester tests lang licenses scenarios; do
            if [ ! -d "$d" ]; then echo "MISSING from the repo: $d/"; missing=1; fi
          done
          if [ "$missing" != "0" ]; then
            echo "A required file is not tracked by git. If it is BeanNetworkTester.spec,"
            echo "it is git-ignored by *.spec - force-add it: git add -f BeanNetworkTester.spec"
            exit 1
          fi
          echo "All required release files are present."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt

      # ONE run of the whole suite, under coverage. testpaths=["tests"] (pyproject)
      # means this already includes the suites that used to own separate steps:
      #   * property-based matchers + CLI fuzzing - the filter mini-language runs in
      #     the packet hot path (it must never raise), and the CLI is the CI contract
      #     (every outcome has an exit code, never a traceback);
      #   * concurrency chaos - threads are only dangerous together: a "running"
      #     engine with a dead capture thread means WinDivert is queueing the user's
      #     packets into a void.
      # Those steps re-ran tests the full run had just executed, on every matrix cell.
      # pytest names the failing file, so the extra checkmarks bought no diagnosis.
      #
      # COVERAGE_PROCESS_START is not optional: the GUI tests run in subprocesses,
      # and without it every line they exercise is reported as uncovered, so the same
      # suite reads far lower and a sane gate would fail on healthy code. The measured
      # split (with/without it) and the gate itself live in ONE place - pyproject
      # (fail_under, and the comment above it) - so they are not restated here, where a
      # copied number only drifts out of date.
      - name: Test suite + coverage gate (engine, i18n, CLI, fail-safe, tables, chaos)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: python -m pytest tests --cov=beantester --cov-report=term --cov-report=xml

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: GUI smoke (fake tkinter)
        run: python smoke_gui.py

      # Headed render on real Tk under a virtual display (Linux only). The fake-tk
      # smoke cannot see truncation or DPI/layout breakage; this builds the real App
      # at the minimum supported resolution in BOTH languages (Polish strings are the
      # longest - that is where layouts crack) and fails on any clipped key widget.
      - name: GUI render check (real Tk, Xvfb, 1366x768, PL+EN)
        if: runner.os == 'Linux'
        env:
          BEAN_NO_ELEVATE: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          xvfb-run -a --server-args="-screen 0 1366x768x24" \
            python tools/ci_gui_render.py

      # The CLI contract itself: --simulate needs neither Windows, WinDivert nor
      # admin, so every runner can prove it end to end.
      - name: CLI - simulation run
        run: python bean_network_tester.py --simulate --loss 10 --duration 2 --interval 1 --seed 42

      - name: CLI - config validation without touching the driver
        run: python bean_network_tester.py --dry-run --loss 10 --dst-port "80,443,!8080"

      - name: CLI - environment report
        run: python bean_network_tester.py --doctor

      - name: CLI - licence and third-party notices
        run: python bean_network_tester.py --license

      # Exit codes are the contract CI depends on - assert them, do not assume.
      - name: CLI - exit codes are honoured
        shell: bash
        run: |
          set +e
          python bean_network_tester.py --simulate --duration 1 ; ok=$?
          python bean_network_tester.py --simulate --loss 250   ; bad_cfg=$?
          python bean_network_tester.py --simulate --duration 1 --scenario nope.json ; bad_scen=$?
          python bean_network_tester.py --simulate --duration 1 --min-packets 999999999 ; assertion=$?
          set -e
          echo "ok=$ok config=$bad_cfg scenario=$bad_scen assertion=$assertion"
          test "$ok" = "0"        || { echo "a clean run must exit 0";       exit 1; }
          test "$bad_cfg" = "3"   || { echo "a bad value must exit 3";       exit 1; }
          test "$bad_scen" = "4"  || { echo "a bad scenario must exit 4";    exit 1; }
          test "$assertion" = "6" || { echo "a failed check must exit 6";    exit 1; }

      # Machine-readable output must stay machine-readable (stdout = NDJSON only).
      - name: CLI - NDJSON output parses
        shell: bash
        run: |
          python bean_network_tester.py --simulate --duration 2 --interval 1 --format json --seed 7 > run.ndjson
          python -c "
          import json
          records = [json.loads(l) for l in open('run.ndjson') if l.strip()]
          summary = records[-1]
          assert summary['event'] == 'summary', summary
          assert summary['exit_code'] == 0 and summary['seed'] == 7, summary
          print('NDJSON ok:', len(records), 'records')
          "

  build:
    name: build the executable (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Must match the interpreter release.yml builds with: PyInstaller freezes
      # THIS Python into the bundle, so a CI build on a different one is not
      # smoke-testing the artefact users get.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # One hash-checked resolution over both files: the runtime pins and
          # the freezer's whole closure. Nothing here may resolve to bytes
          # that are not written down.
          pip install --require-hashes -r requirements.txt -r requirements-build.txt

      # onedir + console subsystem + asInvoker - see BeanNetworkTester.spec
      - name: Build
        run: pyinstaller --noconfirm BeanNetworkTester.spec

      # The whole point of the console-subsystem build: the CLI works from the
      # EXECUTABLE, the shell waits for it, and the exit code comes back.
      - name: Smoke the built exe (CLI mode)
        shell: bash
        run: |
          set +e
          EXE="dist/BeanNetworkTester/BeanNetworkTester.exe"
          "$EXE" --version ; version=$?
          "$EXE" --simulate --duration 2 --interval 1 --seed 42 ; run=$?
          "$EXE" --simulate --loss 250 ; bad=$?
          set -e
          echo "version=$version run=$run bad=$bad"
          test "$version" = "0" || { echo "--version must work from the exe";        exit 1; }
          test "$run" = "0"     || { echo "the exe must run a simulated session";    exit 1; }
          test "$bad" = "3"     || { echo "the exe must report a config error as 3"; exit 1; }

      - name: The exe ships the WinDivert driver next to itself (never in %TEMP%)
        shell: bash
        run: |
          find dist/BeanNetworkTester -iname "WinDivert*" -print | tee found.txt
          test -s found.txt || { echo "WinDivert.dll/.sys is missing from the bundle"; exit 1; }

      # 🔴 The scanner guards the REGISTRY, not the other way round. `legal.py` is
      # the reviewed list of what we ship and the SBOM is generated from it, so the
      # question worth asking on every build is "does the bundle contain something
      # that list does not know?". It already has an answer: on 2026-08-11 this
      # comparison found zlib, libffi and 42 Microsoft runtime files shipping in
      # every release while every list claimed to be complete.
      #
      # Here rather than in release.yml deliberately. This job has `contents: read`
      # and cuts no tag, so a third-party action costs far less here - and a hole
      # found at PR time is cheaper than one found while publishing. Syft is pinned
      # by SHA; the tag it stood at is in the comment.
      - name: Scan the bundle and hold the licence registry to it
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: dist/BeanNetworkTester
          format: syft-json
          output-file: bundle-scan.json
          upload-artifact: false
          upload-release-assets: false

      - name: The registry must account for everything the scan found
        shell: bash
        run: python tools/sbom.py --audit-bundle bundle-scan.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: BeanNetworkTester-windows
          path: dist/BeanNetworkTester
