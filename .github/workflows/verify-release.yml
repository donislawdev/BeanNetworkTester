# The last step of a release: check the thing people can actually download.
#
# Everything before this verifies an artefact, a draft, or a digest passed between
# workflows. None of it touches the published release page, and the published page is
# the only thing a user ever sees. Until 2026-08-21 the commands in the README were
# run by a human, occasionally, after the fact - and that is exactly how the first
# documented verify command shipped broken for every user of 0.5.0-rc.2 and again
# for 0.5.0, where `gh attestation verify <zip> -R <repo>` answers HTTP 404 because
# it looks for build provenance that a hand-signed archive deliberately does not have.
#
# 🔴 So this runs THE COMMANDS FROM THE README, verbatim, against the published
# assets. Not equivalents, not a re-implementation: if the README's command stops
# working, this has to be what goes red. `tests/test_version_and_release.py` pins the
# two together so neither can drift alone.
#
# Runs on Windows because one of the checks is Authenticode, which does not exist
# anywhere else - and the signature is the half of the release a checksum cannot
# speak for. The Linux package is checked by a second job, on Ubuntu, which also
# RUNS it: unpacked from the published .tar.gz, the way a person gets it.
name: Verify the published release

on:
  release:
    types: [published]
  # Re-runnable by hand against any published tag, because "did that old release
  # still verify" is a question worth being able to ask without cutting a new one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published tag to check, e.g. v0.5.0"
        required: true

permissions:
  contents: read

jobs:
  # Which release, and whether it carries the Linux package: one answer both jobs
  # below read, so the Windows job's list of assets and the Linux job's running
  # cannot disagree about it.
  which:
    name: Work out which release we are checking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      linux: ${{ steps.which.outputs.linux }}
    steps:
      - name: Work out which release we are checking
        id: which
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          test -n "$tag" || { echo "no tag to check"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The Linux package ships from 1.0.0 on. An older release, checked again by
          # hand, has none to check - and is not wrong for it.
          base="${tag#v}"
          base="${base%%-*}"
          if [ "$(printf '%s\n' 1.0.0 "$base" | sort -V | head -n 1)" = "1.0.0" ]; then
            echo "linux=true" >> "$GITHUB_OUTPUT"
          else
            echo "linux=false" >> "$GITHUB_OUTPUT"
          fi
          echo "checking $tag (prerelease=${PRERELEASE:-unknown}, Linux package from 1.0.0: base $base)"

  verify:
    name: Download what users download, then check it
    needs: which
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      # Reading the release assets. Nothing here writes anything, anywhere.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download every published asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.which.outputs.tag }}
          LINUX: ${{ needs.which.outputs.linux }}
        run: |
          mkdir -p published && cd published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -l
          # Four assets always ship: the Windows archive, the checksums, its SBOM and
          # its bundle; from 1.0.0 three more, the Linux package with its own SBOM and
          # bundle. A missing one means a phase did not finish, which is precisely the
          # half-failure nobody would notice by looking at the page. By NAME: the two
          # SBOMs and the two bundles share their endings, so a pattern would pass a
          # release missing one of each.
          names=("BeanNetworkTester-${TAG}-windows-x64.zip" SHA256SUMS.txt
                 "BeanNetworkTester-${TAG}.spdx.json" "BeanNetworkTester-${TAG}.sigstore.json")
          if [ "$LINUX" = "true" ]; then
            names+=("BeanNetworkTester-${TAG}-linux-x64.tar.gz"
                    "BeanNetworkTester-${TAG}-linux.spdx.json"
                    "BeanNetworkTester-${TAG}-linux.sigstore.json")
          fi
          for name in "${names[@]}"; do
            test -f "$name" || { echo "MISSING asset: $name"; exit 1; }
          done
          # A fifth ships on a full release only. 🔴 The rule is `-rc` in the tag and
          # it is the SAME rule as `is_release_candidate` in tools/sign_release.py -
          # `test_the_candidate_rule_is_the_same_one_in_both_places` keeps the pair
          # honest, because two different answers here would mean either a release
          # published without its installer or every candidate failing this job.
          # Checked in BOTH directions on purpose: a candidate that somehow carried
          # an MSI would be the bug that strands whoever installed it, since Windows
          # Installer cannot tell `-rc.1` from the release.
          case "$TAG" in
            *-rc*)
              ! ls ./*.msi >/dev/null 2>&1 || {
                echo "a release candidate must NOT carry an .msi: $(ls ./*.msi)"; exit 1; }
              echo "$TAG is a release candidate: no installer expected, and none present"
              ;;
            *)
              ls ./*.msi >/dev/null 2>&1 || { echo "MISSING asset: *.msi"; exit 1; }
              ;;
          esac

      - name: The checksum users are told to compare
        shell: bash
        working-directory: published
        run: |
          # The file is written in `sha256sum -c` format; the `*` before the name is
          # the binary-mode marker, not a typo, and `sha256sum` expects it.
          sha256sum -c SHA256SUMS.txt

      - name: The offline command from the README, verbatim
        shell: bash
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.which.outputs.tag }}
        run: |
          zip="BeanNetworkTester-${TAG}-windows-x64.zip"
          bundle="BeanNetworkTester-${TAG}.sigstore.json"
          gh attestation verify "$zip" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: The online command from the README, verbatim
        shell: bash
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.which.outputs.tag }}
        run: |
          zip="BeanNetworkTester-${TAG}-windows-x64.zip"
          gh attestation verify "$zip" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: The signature, and that it is OUR certificate
        shell: pwsh
        working-directory: published
        run: |
          # Convention 46: pwsh first. This step is the reason the job runs on
          # Windows - a checksum says the bytes are unchanged, and says nothing at
          # all about who signed them.
          $zip = (Get-ChildItem -Filter *.zip)[0].FullName
          Expand-Archive -LiteralPath $zip -DestinationPath unpacked -Force
          $exe = Get-ChildItem -Path unpacked -Filter BeanNetworkTester.exe -Recurse |
                 Select-Object -First 1
          if (-not $exe) { throw "no BeanNetworkTester.exe inside the archive" }

          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          "status  : $($sig.Status)"
          "subject : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature status is $($sig.Status)" }

          # Without a timestamp the signature dies when the certificate expires, so
          # its absence is a real defect and not a detail.
          if (-not $sig.TimeStamperCertificate) { throw "the signature carries no timestamp" }
          "stamped : $($sig.TimeStamperCertificate.Subject)"

          $bytes = [System.Security.Cryptography.SHA256]::Create().ComputeHash(
                     $sig.SignerCertificate.RawData)
          $actual = ($bytes | ForEach-Object { $_.ToString('x2') }) -join ''
          # Read the pin out of the source rather than repeating it here: two copies
          # of a constant are two things that can disagree, and this one moves when
          # the certificate is renewed.
          $line = Select-String -Path ../beantester/legal.py -Pattern '^CODESIGN_SHA256 = "([0-9a-f]{64})"'
          if (-not $line) { throw "could not read CODESIGN_SHA256 out of beantester/legal.py" }
          $pinned = $line.Matches[0].Groups[1].Value
          "pinned  : $pinned"
          "actual  : $actual"
          if ($actual -ne $pinned) { throw "the shipped file was signed by a DIFFERENT certificate" }

          # The installer is a second signed artefact, and an unsigned one is worse
          # than no installer: it is the file corporate deployment pushes to machines
          # nobody will ever log into. It carries the executable checked above, so a
          # valid signature here is what says the wrapper was not rebuilt around it.
          $msi = Get-ChildItem -Filter *.msi -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $msi) {
            "no .msi on this release - a release candidate ships none, on purpose"
          } else {
            $msiSig = Get-AuthenticodeSignature -LiteralPath $msi.FullName
            "installer: $($msi.Name)"
            "status   : $($msiSig.Status)"
            if ($msiSig.Status -ne 'Valid') { throw "installer signature status is $($msiSig.Status)" }
            if (-not $msiSig.TimeStamperCertificate) { throw "the installer signature carries no timestamp" }
            $msiBytes = [System.Security.Cryptography.SHA256]::Create().ComputeHash(
                          $msiSig.SignerCertificate.RawData)
            $msiActual = ($msiBytes | ForEach-Object { $_.ToString('x2') }) -join ''
            "actual   : $msiActual"
            if ($msiActual -ne $pinned) { throw "the installer was signed by a DIFFERENT certificate" }
          }

      - name: A full release must be the one the website offers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.which.outputs.tag }}
        run: |
          # The download button on the project site points at /releases/latest, so
          # "published" and "what people get" are only the same thing if this holds.
          # Asked of the API rather than the event payload, because a dispatch has no
          # payload and a pre-release is SUPPOSED to fail this.
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" = "true" ]; then
            echo "$TAG is a pre-release: it must NOT be latest, and is not checked here"
            exit 0
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "latest is $latest, this release is $TAG"
          test "$latest" = "$TAG"

  # The Linux package as a person gets it: the published .tar.gz, its checksum line
  # and the README's two commands for it, then unpacked and RUN - the CLI, the
  # Reproduce line, the user files, the window and the menu entry, under Xvfb, with
  # the same tools/ci_linux_package_smoke.py that judged the build. A release before
  # 1.0.0 carries no package, so there is nothing to check.
  verify-linux:
    name: Download the Linux package users download, then check and run it
    needs: which
    if: needs.which.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Reading the release assets. Nothing here writes anything, anywhere.
      contents: read
    env:
      TAG: ${{ needs.which.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux package, its checksums and its bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published && cd published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "BeanNetworkTester-${TAG}-linux-x64.tar.gz" \
            --pattern "BeanNetworkTester-${TAG}-linux.sigstore.json" \
            --pattern SHA256SUMS.txt
          ls -l

      # The README's Linux line: the person downloaded the package alone, so the
      # Windows lines of the file are skipped rather than reported missing.
      - name: The checksum users are told to compare
        shell: bash
        working-directory: published
        run: sha256sum -c --ignore-missing SHA256SUMS.txt

      - name: The offline command from the README, verbatim
        shell: bash
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "BeanNetworkTester-${TAG}-linux-x64.tar.gz" \
            --bundle "BeanNetworkTester-${TAG}-linux.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: The online command from the README, verbatim
        shell: bash
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "BeanNetworkTester-${TAG}-linux-x64.tar.gz" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3

      # Unlike the signed Windows zip, these are the bytes release.yml built, so the
      # build provenance describes the published file itself: which commit, which
      # workflow. Not a README command - the SBOM one above is the one people run.
      - name: The build provenance of the published package
        shell: bash
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "BeanNetworkTester-${TAG}-linux-x64.tar.gz" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      # The display, the window list and the desktop-entry checker the smoke uses.
      # Not Tk: the package carries its own, and this is where that is proven.
      - name: Xvfb and the X tools
        run: |
          missing=""
          for package in xvfb x11-utils desktop-file-utils; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
                          /etc/apt/sources.list.d/*.sources \
                          /etc/apt/sources.list.d/*.list; do
              if [ -f "$source" ]; then
                sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
              fi
            done
            # $missing unquoted on purpose: it is a list of package names.
            # shellcheck disable=SC2086
            if ! sudo timeout 180 apt-get install -y --no-install-recommends $missing; then
              sudo timeout 240 apt-get update \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
              sudo timeout 240 apt-get install -y --no-install-recommends $missing
            fi
          fi

      # Unpacked the way the README says, by a person, and run by the system's own
      # Python 3: the smoke needs no more, and no setup-python environment reaches
      # the program it starts.
      - name: Unpack it and run it as a person does
        shell: bash
        run: |
          mkdir -p unpacked
          tar -xzf "published/BeanNetworkTester-${TAG}-linux-x64.tar.gz" -C unpacked
          test -x unpacked/BeanNetworkTester/BeanNetworkTester
          timeout 300 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            python3 -u tools/ci_linux_package_smoke.py unpacked/BeanNetworkTester/BeanNetworkTester
