name: Release

# Build and publish a Windows release whenever a version tag is pushed. Tag the
# default branch only after CI (tests + build) is green:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

# Read-only at the top, and the job below raises exactly what it needs. Same rule as
# ci.yml, pages.yml and scorecard.yml already follow; this file was the last one
# breaking it, and OpenSSF Scorecard named it (Token-Permissions, 0/10, 2026-08-19).
#
# 🔴 Not cosmetic while there is only one job. A permission written here is granted
# to every job ADDED to this file later - a job whose author has no reason to scroll
# back up, in the one workflow that can publish an asset under this project's name.
permissions:
  contents: read

jobs:
  release:
    name: Build and publish the Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # Creating a Release and uploading its assets. The default token only reads.
      contents: write
      # For the SBOM attestation. `id-token` mints the short-lived OIDC token that
      # signs it, `attestations` writes the result to the repository's attestation
      # store. Both are required by actions/attest and neither grants anything else;
      # a release that skipped them would still publish an SBOM, just an unsigned one
      # that anybody could swap.
      #
      # NOT here on purpose: `artifact-metadata: write`, which that action's README
      # lists as a third permission. It is needed to create the artifact STORAGE
      # RECORD, and `create-storage-record` requires `push-to-registry`, which
      # defaults to false and is not used here (read in the action's own action.yml,
      # 2026-08-12). Granting a permission we do not need would contradict the line
      # above it.
      id-token: write
      attestations: write
      # Reading the CI runs for the tagged commit, for the gate that is the first
      # step below. Read-only, and it is the whole reason this scope is here.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 🔴 FIRST, before anything is installed or built: was CI green on EXACTLY
      # this commit? This workflow deliberately does not re-run the tests - it
      # builds and publishes - so until 2026-08-21 the only thing standing between a
      # red commit and a published release was somebody remembering. That was step 1
      # of the recipe, it was written down as manual, and a rule kept by memory is a
      # rule that eventually is not.
      #
      # Keyed on the CI workflow BY NAME rather than "are all checks green": this
      # repository has a check that fails for a reason of its own (a code-scanning
      # feature the account is not licensed for), and a gate that demands a clean
      # sweep of everything would block every release over something unrelated.
      - name: Refuse to build unless CI was green on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | map(.conclusion)')"
          echo "completed CI runs on $GITHUB_SHA: $runs"
          if [ "$runs" = "[]" ]; then
            echo "::error::No completed CI run for $GITHUB_SHA. Tag a commit that CI has"
            echo "::error::finished on - this workflow does not run the tests itself."
            exit 1
          fi
          if ! echo "$runs" | grep -q '"success"'; then
            echo "::error::CI did not succeed on $GITHUB_SHA ($runs). Releasing this tag"
            echo "::error::would publish code that was never proven to build or pass."
            exit 1
          fi
          echo "CI is green on the commit being released."

      # The interpreter PyInstaller freezes into the shipped bundle. Keep it in
      # step with the build job in ci.yml, or CI smoke-tests one artefact and
      # users download another.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          # One hash-checked resolution over both files - the same command the
          # build job in ci.yml runs, so a release cannot be built from a
          # different set of bytes than the one CI proved.
          pip install --require-hashes -r requirements.txt -r requirements-build.txt

      # The version is single-sourced in VERSION.txt. The tag is v<version> for a
      # final release, or v<version>-rc.N (also -beta.N / -alpha.N) for a pre-release.
      # Its BASE must match VERSION.txt so a release can never ship mislabelled, and the
      # presence of a -suffix decides whether GitHub marks it a pre-release.
      - name: Check the tag against VERSION.txt
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"       # v0.3.0        or  v0.3.0-rc.4
          ver="${ref#v}"                 # 0.3.0             0.3.0-rc.4
          base="${ver%%-*}"              # 0.3.0             0.3.0
          version="$(cat VERSION.txt)"
          echo "tag=$ref base=$base VERSION.txt=$version"
          test "$base" = "$version" || { echo "tag base v$base != VERSION.txt $version"; exit 1; }
          if [ "$ver" != "$base" ]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi
          echo "TITLE=$ver" >> "$GITHUB_ENV"

      # The step above proves the tag is LABELLED right. This one proves the release
      # NOTES are, which is a different thing and had no check at all until 0.4.0:
      # 43 commits landed after the v0.4.0-rc.1 tag and collected under [Unreleased],
      # three of them BREAKING. Tagging v0.4.0 then would have passed the check above
      # (the base still matched VERSION.txt) and published a changelog that dated
      # 0.4.0 weeks earlier and filed three contract breaks as "not released yet".
      # A pre-release tag is checked the same way: -rc.N ships the same notes.
      - name: Check the changelogs are closed for this version
        shell: bash
        run: |
          version="$(cat VERSION.txt)"
          escaped="${version//./\\.}"
          fail=0
          # CHANGELOG-INTERNAL.md is not in the repository, so this job cannot
          # see it. Its structure is guarded locally by .claude/hooks/check_notes.py.
          for f in CHANGELOG.md; do
            grep -qE "^## \[${escaped}\] +- +[0-9]{4}-[0-9]{2}-[0-9]{2}" "$f" \
              || { echo "$f: no dated '## [$version] - YYYY-MM-DD' section"; fail=1; }
            open="$(awk '/^## \[Unreleased\]/{u=1;next} /^## \[/{u=0} u && /^- /{n++} END{print n+0}' "$f")"
            test "$open" = "0" \
              || { echo "$f: [Unreleased] still holds $open entries - they would ship as $version while reading as unreleased"; fail=1; }
          done
          test "$fail" = "0" || exit 1
          echo "changelogs closed for $version"

      # CI (ci.yml) already runs the full test suite on every push to master - i.e. on
      # exactly this commit - so the release does not re-test. It builds, smoke-tests the
      # exe and publishes. (Re-testing here would also need the dev deps and could hit
      # environment-specific flakes that CI's environment does not.)
      # onedir + console subsystem + asInvoker - see BeanNetworkTester.spec
      - name: Build
        run: pyinstaller --noconfirm BeanNetworkTester.spec

      # Prove the shipped artefact actually runs before it is attached to a public
      # release (the console-subsystem build means the exe returns an exit code).
      - name: Smoke the built exe
        shell: bash
        run: |
          set +e
          EXE="dist/BeanNetworkTester/BeanNetworkTester.exe"
          "$EXE" --version ; v=$?
          "$EXE" --simulate --duration 2 --interval 1 --seed 42 ; r=$?
          set -e
          echo "version=$v run=$r"
          test "$v" = "0" || { echo "--version failed";        exit 1; }
          test "$r" = "0" || { echo "simulated run failed";     exit 1; }

      # Zip the onedir bundle. 🔴 No SHA256SUMS.txt here any more: these bytes are not
      # the bytes a user downloads. The executable inside is still unsigned, and
      # `tools/sign_release.py` signs it on the machine that holds the card - which
      # changes the archive, and would leave a checksum written here describing a file
      # nobody has. The checksum is written next to the signature, over the same bytes.
      - name: Package (zip)
        shell: bash
        run: |
          name="BeanNetworkTester-${GITHUB_REF_NAME}-windows-x64"
          ( cd dist && 7z a "../${name}.zip" BeanNetworkTester >/dev/null )
          sha256sum "${name}.zip"
          echo "ASSET=${name}.zip" >> "$GITHUB_ENV"

      # The SBOM is generated from `beantester/legal.py`, the reviewed list of what
      # this build ships - not from a scan. Measured 2026-08-11: a scanner reading
      # the built bundle finds CPython, Tcl and Tk with versions but misses psutil,
      # PyDivert and PyInstaller (PyInstaller strips `.dist-info`), never sees
      # `WinDivert64.sys`, and attaches no licence to anything. The registry has the
      # licences; the scanner's job is to guard it, which is a separate step below.
      #
      # The tag seeds the document namespace, so re-running this workflow on the
      # same tag produces the same URI instead of a fresh random one.
      - name: Generate the SBOM (SPDX 2.3)
        shell: bash
        run: |
          python tools/sbom.py --namespace-seed "$GITHUB_REF_NAME" \
                 -o "BeanNetworkTester-${GITHUB_REF_NAME}.spdx.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); \
                     print('packages:', len(d['packages']))" \
                 "BeanNetworkTester-${GITHUB_REF_NAME}.spdx.json"
          echo "SBOM=BeanNetworkTester-${GITHUB_REF_NAME}.spdx.json" >> "$GITHUB_ENV"

      # WHO built it, and FROM WHAT. The SBOM attestation above says what is inside
      # the zip; this one says the zip came out of this repository, from this commit,
      # through this workflow, on a GitHub-hosted runner - signed with the same
      # short-lived OIDC identity and stored in the same attestation store. A user
      # checks both with one command:
      #
      #     gh attestation verify BeanNetworkTester-<tag>-windows-x64.zip \
      #        -R donislawdev/BeanNetworkTester
      #
      # It is a different question from a code signature, which is why both are
      # worth having: a signature says who signed the binary, provenance says which
      # source and which build produced it. A stolen signing key cannot forge this,
      # and a forked workflow cannot claim to be this repository.
      #
      # Separate action from `actions/attest` above on purpose: that one attaches a
      # predicate you hand it (here, the SBOM), while the provenance predicate is
      # built BY the action from the workflow's own context - there is nothing to
      # pass in, and nothing we could pass in that would be trustworthy.
      - name: Attest the build provenance of the release archive
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      # gh is preinstalled on the runner - no third-party action, uses the job token.
      # A -rc/-beta/-alpha tag publishes as a "Pre-release"; a plain tag as "Latest".
      #
      # The body is this version's section of CHANGELOG.md, not --generate-notes.
      # --generate-notes lists merged pull request titles, so the release page showed
      # something nobody wrote and never showed the changelog at all - for 0.4.0 that
      # would have been 43 PR titles. Extracting the section instead means the release
      # page, a blog post and CHANGELOG.md are one text that cannot drift apart.
      # The step above has already proved that section exists and is dated.
      - name: Open the release as a DRAFT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python tools/release_notes.py > RELEASE_NOTES.md
          head -5 RELEASE_NOTES.md
          flags=(--draft --title "$TITLE" --notes-file RELEASE_NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" "$SBOM" "${flags[@]}"

      # 🔴 The build leaves as an ARTEFACT, not as a release asset, and the reason is
      # that it is not finished. The executable inside is unsigned, and this runner
      # cannot sign it: the key lives on a cryptographic card in a USB reader on the
      # maintainer's desk and cannot be exported. Attaching it here would put an
      # unsigned file on a public release page for as long as the ritual takes, and
      # somebody would download it.
      #
      # The name is what `tools/sign_release.py` fetches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-build-${{ github.ref_name }}
          path: ${{ env.ASSET }}
          retention-days: 7

      - name: Say what happens next
        shell: bash
        run: |
          echo "Built, attested, and opened as a DRAFT release."
          echo
          echo "Now, on the machine with the card:"
          echo "    python tools/sign_release.py ${GITHUB_REF_NAME}"
          echo
          echo "That signs the executable, checks it was the pinned certificate that"
          echo "signed it, uploads the archive and its checksum, and asks"
          echo "attest-release.yml for the bundle. Then read the draft and publish it."
